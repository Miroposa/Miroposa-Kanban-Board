  <dialog id="column-editor">
    <form method="dialog" class="dialog-body" id="column-form">
      <h3>Neue Spalte</h3>
      <label>Name
        <input id="field-col-title" type="text" required placeholder="z. B. Ideen Park" maxlength="40" />
      </label>
      <label>Kurzbeschreibung (optional)
        <input id="field-col-hint" type="text" placeholder="Was gehört hier rein?" maxlength="80" />
      </label>
      <label>Farbe
        <div class="color-picker" id="field-col-color" role="listbox" aria-label="Spaltenfarbe"></div>
      </label>
      <div class="dialog-actions">
        <button type="button" class="secondary" id="btn-col-cancel">Abbrechen</button>
        <button type="submit" id="btn-col-save">Anlegen</button>
      </div>
    </form>
  </dialog>

  <script>
    const STORAGE_KEY = "janamathics-kanban-v1";
    const FILE_HANDLE_DB = "janamathics-kanban-handles";
    const FILE_HANDLE_STORE = "handles";
    const FILE_HANDLE_KEY = "autosave";
    const DEFAULT_FILE_NAME = "janamathics-kanban.json";
    const BOARD_API = "/janamathics-kanban.json";
    const IS_FILE_PROTOCOL = location.protocol === "file:";
    let serverSaveOk = !IS_FILE_PROTOCOL;
    let diskSaveTimer = null;

    /** @type {FileSystemFileHandle|null} */
    let fileHandle = null;
    let fileSaveTimer = null;
    let fileNameLabel = "";

    const COLOR_OPTIONS = [
      { id: "none", label: "Standard", accent: "#9a917c", card: "#fffdf6", border: "#cfc6b0" },
      { id: "yellow", label: "Gelb", accent: "#d4920f", card: "#fff1a8", border: "#e0b020" },
      { id: "green", label: "Grün", accent: "#3d8a38", card: "#d5efd0", border: "#5fad58" },
      { id: "blue", label: "Blau", accent: "#3a6fa0", card: "#cfe6fb", border: "#4f91c4" },
      { id: "orange", label: "Orange", accent: "#d45a18", card: "#ffe0b8", border: "#e07a30" },
      { id: "brown", label: "Braun", accent: "#6f4a2c", card: "#e8d5be", border: "#a67c52" },
      { id: "purple", label: "Lila", accent: "#6b4ea0", card: "#ead8f2", border: "#9575cd" },
      { id: "pink", label: "Rosa", accent: "#c2185b", card: "#f8d0df", border: "#ec407a" },
      { id: "teal", label: "Türkis", accent: "#00796b", card: "#c8ebe6", border: "#26a69a" },
    ];

    const DEFAULT_COLUMN_COLOR = {
      ist: "green",
      brainstorm: "yellow",
      backlog: "orange",
      next: "blue",
      "in-bearbeitung": "brown",
    };

    const DEFAULT_COLUMNS = [
      { id: "ist", title: "Umgesetzt", hint: "Was schon im Spiel steckt", color: "green" },
      { id: "brainstorm", title: "Brainstorm", hint: "Freie Ideen", color: "yellow" },
      { id: "backlog", title: "Backlog", hint: "Irgendwann / geparkt", color: "orange" },
      { id: "next", title: "Als Nächstes", hint: "Konkrete Prioritäten", color: "blue" },
    ];

    const SEED_CARDS = [
      { id: "c1", column: "ist", title: "2D Godot 4.7 – Janamathics", notes: "" },
      { id: "c2", column: "ist", title: "Outdoor: Schule, Straße, Parallax", notes: "" },
      { id: "c3", column: "ist", title: "Player: laufen, springen, Animationen", notes: "" },
      { id: "c4", column: "ist", title: "Schultür → Klassenzimmer (Verweil-Delay)", notes: "" },
      { id: "c5", column: "ist", title: "Mathe-Quiz: +/−, Level, Leben, Highscore", notes: "" },
      { id: "c6", column: "ist", title: "Früchte & Blumen sammeln (Respawn)", notes: "" },
      { id: "c7", column: "ist", title: "Spielplatz: Schaukel, Rutsche, Federwippe", notes: "" },
      { id: "c8", column: "ist", title: "HUD: Score + Herzen (global)", notes: "" },
      { id: "c9", column: "ist", title: "GameState Autoload über Szenen", notes: "" },
      { id: "b1", column: "brainstorm", title: "Rückweg Klassenzimmer → Außenwelt", notes: "" },
      { id: "b2", column: "brainstorm", title: "Mehr Karten: Wald, Park, Stadt", notes: "" },
      { id: "b3", column: "brainstorm", title: "NPCs / Freunde zum Quatschen", notes: "" },
      { id: "b4", column: "brainstorm", title: "Geheimwege & versteckte Sammelobjekte", notes: "" },
      { id: "b5", column: "brainstorm", title: "Tageszeit / Wetter", notes: "" },
      { id: "b6", column: "brainstorm", title: "Mehr Rechenarten: × ÷ Brüche?", notes: "" },
      { id: "b7", column: "brainstorm", title: "Themenwelten: Geld, Uhr, Geometrie", notes: "" },
      { id: "b8", column: "brainstorm", title: "Belohnungen sichtbar in der Welt", notes: "" },
      { id: "b9", column: "brainstorm", title: "Lehrer-NPC / Hilfe bei Fehlern", notes: "" },
      { id: "b10", column: "brainstorm", title: "Speichern / Fortschritt laden", notes: "" },
      { id: "b11", column: "brainstorm", title: "Hauptmenü + Einstellungen", notes: "" },
      { id: "b12", column: "brainstorm", title: "Achievements / Sammelbuch", notes: "" },
      { id: "b13", column: "brainstorm", title: "Offene Fragen: Zielgruppe? Story oder Sandbox? Mobile?", notes: "Zum Brainstormen offen lassen" },
      { id: "n1", column: "next", title: "Rückweg aus dem Klassenzimmer", notes: "Sinnvoller nächster Baustein laut Architektur" },
      { id: "n2", column: "backlog", title: "Controller-Support", notes: "" },
      { id: "n3", column: "backlog", title: "Mehrsprachigkeit DE/EN", notes: "" },
    ];

    function defaultState() {
      return {
        columns: structuredClone(DEFAULT_COLUMNS),
        cards: structuredClone(SEED_CARDS),
      };
    }

    /** @type {{columns: Array<{id:string,title:string,hint:string}>, cards: Array<{id:string,column:string,title:string,notes:string,createdAt?:string}>}} */
    let state = defaultState();
    let editId = null;
    let searchQuery = "";
    /** @type {string} "all" oder COLOR_OPTIONS.id */
    let colorFilter = "all";
    /** @type {Date|null} */
    let lastSaveAt = null;
    /** @type {Array<{at:number,state:object}>} */
    let historyPast = [];
    /** @type {Array<{at:number,state:object}>} */
    let historyFuture = [];
    /** @type {object|null} */
    let committedSnapshot = null;
    let historyLocked = false;
    const HISTORY_MAX_MS = 60 * 60 * 1000;
    /** true = neue Idee nach Speichern per Klick platzieren */
    let createAndPlace = false;
    /** @type {string|null} */
    let placeModeId = null;
    /** @type {HTMLElement|null} */
    let placeGhost = null;
    /** @type {string|null} */
    let draggingColumnId = null;

    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("status");
    const editor = document.getElementById("editor");
    const form = document.getElementById("editor-form");
    const fieldTitle = document.getElementById("field-title");
    const fieldNotes = document.getElementById("field-notes");
    const fieldColumn = document.getElementById("field-column");
    const fieldColumnWrap = document.getElementById("field-column-wrap");
    const fieldCardColor = document.getElementById("field-card-color");
    const fieldColColor = document.getElementById("field-col-color");
    const btnSave = document.getElementById("btn-save");
    const placeBannerText = document.getElementById("place-banner-text");
    let selectedCardColor = "none";
    let selectedColColor = "yellow";

    function getColor(id) {
      return COLOR_OPTIONS.find((c) => c.id === id) || COLOR_OPTIONS[0];
    }

    function buildColorPicker(container, selectedId, onSelect) {
      container.innerHTML = "";
      COLOR_OPTIONS.forEach((opt) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "color-swatch" + (opt.id === selectedId ? " selected" : "");
        btn.dataset.color = opt.id;
        btn.title = opt.label;
        btn.setAttribute("aria-label", opt.label);
        btn.style.background = opt.id === "none" ? "" : opt.accent;
        btn.addEventListener("click", () => {
          onSelect(opt.id);
          buildColorPicker(container, opt.id, onSelect);
        });
        container.appendChild(btn);
      });
    }

    function cardColorId(card) {
      return card.color && card.color !== "none" ? card.color : "none";
    }

    function matchesColorFilter(card) {
      if (colorFilter === "all") return true;
      return cardColorId(card) === colorFilter;
    }

    function buildColorFilters() {
      const bar = document.getElementById("color-filters");
      const btn = document.getElementById("btn-color-filter");
      const dot = document.getElementById("color-filter-dot");
      if (!bar) return;
      const wasOpen = bar.classList.contains("open");
      bar.innerHTML = "";

      const label = document.createElement("span");
      label.className = "color-filters-label";
      label.textContent = "Farbe";
      bar.appendChild(label);

      const allBtn = document.createElement("button");
      allBtn.type = "button";
      allBtn.className = "color-filter-chip" + (colorFilter === "all" ? " active" : "");
      allBtn.dataset.color = "all";
      allBtn.textContent = "Alle";
      allBtn.title = "Alle";
      allBtn.addEventListener("click", () => {
        colorFilter = "all";
        buildColorFilters();
        render();
      });
      bar.appendChild(allBtn);

      COLOR_OPTIONS.forEach((opt) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "color-filter-chip" + (colorFilter === opt.id ? " active" : "");
        chip.dataset.color = opt.id;
        chip.title = opt.label;
        chip.setAttribute("aria-label", opt.label);
        if (opt.id !== "none") chip.style.background = opt.accent;
        chip.addEventListener("click", () => {
          colorFilter = colorFilter === opt.id ? "all" : opt.id;
          buildColorFilters();
          render();
        });
        bar.appendChild(chip);
      });

      if (btn) {
        btn.classList.toggle("active", colorFilter !== "all");
        btn.setAttribute("aria-expanded", wasOpen ? "true" : "false");
      }
      if (dot) {
        if (colorFilter !== "all") {
          const c = getColor(colorFilter);
          dot.hidden = false;
          dot.style.background = colorFilter === "none" ? "#9a917c" : c.accent;
        } else {
          dot.hidden = true;
        }
      }
      if (wasOpen) bar.classList.add("open");
    }

    function setColorFilterOpen(open) {
      const bar = document.getElementById("color-filters");
      const btn = document.getElementById("btn-color-filter");
      if (!bar || !btn) return;
      bar.classList.toggle("open", open);
      btn.setAttribute("aria-expanded", open ? "true" : "false");
    }

    function columns() {
      return state.columns || [];
    }

    function refreshColumnSelect(selected) {
      const current = selected || fieldColumn.value;
      fieldColumn.innerHTML = "";
      columns().forEach((col) => {
        const opt = document.createElement("option");
        opt.value = col.id;
        opt.textContent = col.title;
        fieldColumn.appendChild(opt);
      });
      if ([...fieldColumn.options].some((o) => o.value === current)) {
        fieldColumn.value = current;
      } else if (fieldColumn.options.length) {
        fieldColumn.value = fieldColumn.options[0].value;
      }
    }

    function fallbackColumnId(exceptId) {
      const cols = columns().filter((c) => c.id !== exceptId);
      const prefer = cols.find((c) => c.id === "brainstorm") || cols.find((c) => c.id === "ist") || cols[0];
      return prefer ? prefer.id : null;
    }

    function uid() {
      return "c_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();
        const parsed = JSON.parse(raw);
        return normalizeState(parsed);
      } catch {
        return defaultState();
      }
    }

    function supportsFileAutosave() {
      return typeof window.showSaveFilePicker === "function";
    }

    function openHandleDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(FILE_HANDLE_DB, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(FILE_HANDLE_STORE)) {
            db.createObjectStore(FILE_HANDLE_STORE);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function storeFileHandle(handle) {
      const db = await openHandleDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(FILE_HANDLE_STORE, "readwrite");
        tx.objectStore(FILE_HANDLE_STORE).put(handle, FILE_HANDLE_KEY);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
      db.close();
    }

    async function loadStoredFileHandle() {
      try {
        const db = await openHandleDb();
        const handle = await new Promise((resolve, reject) => {
          const tx = db.transaction(FILE_HANDLE_STORE, "readonly");
          const req = tx.objectStore(FILE_HANDLE_STORE).get(FILE_HANDLE_KEY);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => reject(req.error);
        });
        db.close();
        return handle || null;
      } catch {
        return null;
      }
    }

    async function ensureFilePermission(handle, mode) {
      const opts = { mode: mode || "readwrite" };
      if ((await handle.queryPermission(opts)) === "granted") return true;
      if ((await handle.requestPermission(opts)) === "granted") return true;
      return false;
    }

    async function writeStateToFile() {
      if (!fileHandle) return;
      try {
        if (!(await ensureFilePermission(fileHandle, "readwrite"))) {
          statusEl.textContent = "Datei-Autosave: Bitte erneut „Datei-Autosave“ klicken (Rechte fehlen)";
          return;
        }
        const writable = await fileHandle.createWritable();
        await writable.write(JSON.stringify(state, null, 2));
        await writable.close();
      } catch (err) {
        statusEl.textContent = "Datei-Autosave fehlgeschlagen: " + (err && err.message ? err.message : err);
      }
    }

    function queueFileSave() {
      if (!fileHandle) return;
      clearTimeout(fileSaveTimer);
      fileSaveTimer = setTimeout(() => {
        writeStateToFile();
      }, 250);
    }

    async function loadFromDisk() {
      if (IS_FILE_PROTOCOL) return null;
      try {
        const res = await fetch(BOARD_API, { cache: "no-store" });
        if (!res.ok) return null;
        const parsed = await res.json();
        if (!parsed || !Array.isArray(parsed.cards)) return null;
        serverSaveOk = true;
        return parsed;
      } catch {
        return null;
      }
    }

    function formatSaveStamp(date) {
      const d = date instanceof Date ? date : new Date(date);
      const day = d.toLocaleDateString("de-DE", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
      });
      const time = d.toLocaleTimeString("de-DE", {
        hour: "2-digit",
        minute: "2-digit",
      });
      return day + " – " + time + " Uhr";
    }

    function updateFooterSaveDate(date) {
      const el = document.getElementById("footer-save-date");
      if (!el) return;
      if (date) lastSaveAt = date instanceof Date ? date : new Date(date);
      const stamp = lastSaveAt ? formatSaveStamp(lastSaveAt) : "—";
      el.textContent = "Änderungen werden automatisch gespeichert: Stand " + stamp;
    }

    function queueDiskSave() {
      if (IS_FILE_PROTOCOL) return;
      clearTimeout(diskSaveTimer);
      diskSaveTimer = setTimeout(async () => {
        try {
          const res = await fetch(BOARD_API, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(state),
          });
          const data = await res.json().catch(() => ({}));
          serverSaveOk = res.ok && data.ok !== false;
          if (!serverSaveOk) {
            statusEl.textContent = "⚠ Speichern in Datei fehlgeschlagen – bitte über „Kanban oeffnen.bat“ starten";
          } else {
            updateFooterSaveDate(new Date());
          }
        } catch {
          serverSaveOk = false;
          statusEl.textContent = "⚠ Kein Kanban-Server – bitte Desktop-Verknüpfung / BAT nutzen";
        }
      }, 200);
    }

    function cloneBoardState(src) {
      return JSON.parse(JSON.stringify(src || state));
    }

    function pruneHistoryQuiet() {
      const cutoff = Date.now() - HISTORY_MAX_MS;
      historyPast = historyPast.filter((e) => e && e.at >= cutoff);
      historyFuture = historyFuture.filter((e) => e && e.at >= cutoff);
    }

    function updateHistoryButtons() {
      pruneHistoryQuiet();
      const undoBtn = document.getElementById("btn-undo");
      const redoBtn = document.getElementById("btn-redo");
      if (undoBtn) undoBtn.disabled = historyPast.length === 0;
      if (redoBtn) redoBtn.disabled = historyFuture.length === 0;
    }

    function markHistoryBaseline() {
      committedSnapshot = cloneBoardState(state);
      updateHistoryButtons();
    }

    function applyHistoryState(entry, msg) {
      historyLocked = true;
      state = normalizeState(cloneBoardState(entry.state));
      saveState(msg, { skipHistory: true });
      historyLocked = false;
      refreshColumnSelect();
      render();
      updateHistoryButtons();
    }

    function undoHistory() {
      pruneHistoryQuiet();
      if (!historyPast.length) {
        updateHistoryButtons();
        return;
      }
      historyFuture.push({ at: Date.now(), state: cloneBoardState(state) });
      const entry = historyPast.pop();
      applyHistoryState(entry, "Rückgängig");
    }

    function redoHistory() {
      pruneHistoryQuiet();
      if (!historyFuture.length) {
        updateHistoryButtons();
        return;
      }
      historyPast.push({ at: Date.now(), state: cloneBoardState(state) });
      const entry = historyFuture.pop();
      applyHistoryState(entry, "Wiederholt");
    }

    function saveState(msg, opts) {
      const skipHistory = !!(opts && opts.skipHistory) || historyLocked;
      if (!skipHistory) {
        if (committedSnapshot) {
          historyPast.push({ at: Date.now(), state: committedSnapshot });
          historyFuture = [];
          pruneHistoryQuiet();
          if (historyPast.length > 80) historyPast = historyPast.slice(-80);
        }
      }
      committedSnapshot = cloneBoardState(state);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      queueFileSave();
      queueDiskSave();
      const now = new Date();
      updateFooterSaveDate(now);
      updateHistoryButtons();
      const t =
        now.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", second: "2-digit" }) +
        " Uhr";
      if (IS_FILE_PROTOCOL) {
        statusEl.textContent =
          "⚠ Nur Browser-Speicher (unsicher) · bitte über Desktop-Verknüpfung öffnen · " + t;
        return;
      }
      const where = serverSaveOk ? "" : " · warte auf Datei-Speicher…";
      statusEl.textContent = "✓ " + (msg || "Automatisch gespeichert") + " · " + t + where;
    }

    async function connectAutosaveFile() {
      if (!supportsFileAutosave()) {
        alert(
          "Datei-Autosave braucht Chrome oder Edge und am besten den Start über „Kanban oeffnen.bat“ (localhost).\n\n" +
            "Im Browser wird trotzdem schon automatisch gespeichert – du brauchst keinen Extra-Klick."
        );
        return;
      }
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: DEFAULT_FILE_NAME,
          types: [{ description: "Kanban JSON", accept: { "application/json": [".json"] } }],
        });
        fileHandle = handle;
        fileNameLabel = handle.name || DEFAULT_FILE_NAME;
        await storeFileHandle(handle);
        await writeStateToFile();
        saveState("Datei-Autosave aktiv");
      } catch (err) {
        if (err && err.name === "AbortError") return;
        alert("Datei-Autosave nicht möglich: " + (err && err.message ? err.message : err));
      }
    }

    async function restoreAutosaveFile() {
      if (!supportsFileAutosave()) return;
      const handle = await loadStoredFileHandle();
      if (!handle) return;
      try {
        if (!(await ensureFilePermission(handle, "readwrite"))) return;
        fileHandle = handle;
        fileNameLabel = handle.name || DEFAULT_FILE_NAME;
        statusEl.textContent = "✓ Automatisch gespeichert";
      } catch {
        /* ignore */
      }
    }

    function render() {
      const q = searchQuery.trim().toLowerCase();
      boardEl.innerHTML = "";

      columns().forEach((col) => {
        const cards = state.cards.filter((c) => c.column === col.id);
        const visible = cards.filter((c) => {
          if (!matchesColorFilter(c)) return false;
          if (!q) return true;
          return (c.title + " " + (c.notes || "")).toLowerCase().includes(q);
        });

        const column = document.createElement("section");
        column.className = "column";
        column.dataset.id = col.id;
        const colColor = getColor(col.color || DEFAULT_COLUMN_COLOR[col.id] || "none");
        column.style.borderTopColor = colColor.accent;

        const head = document.createElement("div");
        head.className = "column-head";

        const titleWrap = document.createElement("h2");
        titleWrap.innerHTML =
          col.title + ' <span class="count">' + visible.length + "</span>";

        const headActions = document.createElement("div");
        headActions.className = "column-head-actions";

        const colDrag = document.createElement("button");
        colDrag.type = "button";
        colDrag.className = "btn-col-drag";
        colDrag.title = "Spalte verschieben";
        colDrag.setAttribute("aria-label", "Spalte verschieben");
        colDrag.textContent = "⠿";
        colDrag.draggable = !placeModeId;
        colDrag.addEventListener("dragstart", (e) => {
          if (placeModeId) {
            e.preventDefault();
            return;
          }
          e.stopPropagation();
          draggingColumnId = col.id;
          column.classList.add("col-dragging");
          e.dataTransfer.setData("text/column-id", col.id);
          e.dataTransfer.setData("text/plain", "column:" + col.id);
          e.dataTransfer.effectAllowed = "move";
        });
        colDrag.addEventListener("dragend", () => {
          draggingColumnId = null;
          column.classList.remove("col-dragging");
          clearColumnDropHints();
        });

        const colDel = document.createElement("button");
        colDel.type = "button";
        colDel.className = "btn-col-delete";
        colDel.title = "Spalte löschen";
        colDel.setAttribute("aria-label", "Spalte löschen");
        colDel.textContent = "🗑";
        colDel.addEventListener("click", (e) => {
          e.stopPropagation();
          deleteColumn(col.id);
        });

        headActions.append(colDrag, colDel);
        head.append(titleWrap, headActions);
        column.appendChild(head);

        column.addEventListener("dragover", (e) => {
          if (!draggingColumnId) return;
          e.preventDefault();
          e.stopPropagation();
          e.dataTransfer.dropEffect = "move";
          const rect = column.getBoundingClientRect();
          const before = e.clientX < rect.left + rect.width / 2;
          clearColumnDropHints();
          column.classList.add(before ? "col-drop-before" : "col-drop-after");
        });
        column.addEventListener("dragleave", (e) => {
          if (!column.contains(e.relatedTarget)) {
            column.classList.remove("col-drop-before", "col-drop-after");
          }
        });
        column.addEventListener("drop", (e) => {
          if (!draggingColumnId && !e.dataTransfer.getData("text/column-id")) return;
          const fromId = e.dataTransfer.getData("text/column-id") || draggingColumnId;
          if (!fromId) return;
          e.preventDefault();
          e.stopPropagation();
          const rect = column.getBoundingClientRect();
          const before = e.clientX < rect.left + rect.width / 2;
          clearColumnDropHints();
          moveColumn(fromId, col.id, before ? "before" : "after");
        });

        const hint = document.createElement("p");
        hint.className = "column-hint";
        hint.textContent = col.hint || "Ziehen am ⠿ zum Verschieben";
        column.appendChild(hint);

        const list = document.createElement("div");
        list.className = "cards";
        list.dataset.column = col.id;

        list.addEventListener("dragover", (e) => {
          if (draggingColumnId) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          list.classList.add("drag-over");
        });
        list.addEventListener("dragleave", (e) => {
          if (!list.contains(e.relatedTarget)) list.classList.remove("drag-over");
        });
        list.addEventListener("drop", (e) => {
          e.preventDefault();
          list.classList.remove("drag-over");
          if (placeModeId || draggingColumnId) return;
          const id = e.dataTransfer.getData("text/card-id");
          if (!id) return;
          // Wenn direkt auf eine Karte gedroppt wurde, übernimmt die Karte den Drop
          if (e.target.closest && e.target.closest(".card")) return;
          moveCard(id, col.id);
        });

        list.addEventListener("click", (e) => {
          if (!placeModeId) return;
          if (e.target.closest && e.target.closest(".card")) return;
          finishPlace(col.id);
        });

        column.addEventListener("click", (e) => {
          if (!placeModeId) return;
          if (e.target.closest(".column-head") || e.target.closest(".column-hint") || e.target.closest(".column-foot")) {
            finishPlace(col.id);
          }
        });

        if (!visible.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = placeModeId
            ? "Hier klicken, um die Idee abzulegen"
            : q
              ? "Keine Treffer"
              : "Zieh Ideen hierher oder + Idee";
          empty.addEventListener("click", () => {
            if (placeModeId) finishPlace(col.id);
          });
          list.appendChild(empty);
        }

        visible.forEach((card) => list.appendChild(renderCard(card)));
        column.appendChild(list);

        const foot = document.createElement("div");
        foot.className = "column-foot";
        const addBtn = document.createElement("button");
        addBtn.type = "button";
        addBtn.textContent = "+ Idee";
        addBtn.addEventListener("click", () => openEditor(null, col.id));
        foot.appendChild(addBtn);
        column.appendChild(foot);

        boardEl.appendChild(column);
      });
    }

    function clearDropHints() {
      document.querySelectorAll(".card.drop-target, .card.drop-before, .card.drop-after, .cards.drag-over").forEach((el) => {
        el.classList.remove("drop-target", "drop-before", "drop-after", "drag-over");
      });
    }

    function clearColumnDropHints() {
      document.querySelectorAll(".column.col-drop-before, .column.col-drop-after, .column.col-dragging").forEach((el) => {
        el.classList.remove("col-drop-before", "col-drop-after", "col-dragging");
      });
    }

    function moveColumn(fromId, toId, place) {
      if (!fromId || !toId || fromId === toId) {
        draggingColumnId = null;
        return;
      }
      const fromIdx = state.columns.findIndex((c) => c.id === fromId);
      const toIdx = state.columns.findIndex((c) => c.id === toId);
      if (fromIdx < 0 || toIdx < 0) {
        draggingColumnId = null;
        return;
      }
      const [col] = state.columns.splice(fromIdx, 1);
      let insertAt = state.columns.findIndex((c) => c.id === toId);
      if (insertAt < 0) insertAt = state.columns.length;
      if (place === "after") insertAt += 1;
      state.columns.splice(insertAt, 0, col);
      draggingColumnId = null;
      saveState("Spalte verschoben");
      render();
    }

    function renderCard(card) {
      const el = document.createElement("article");
      el.className = "card";
      if (placeModeId && card.id === placeModeId) el.classList.add("placing-source");
      el.draggable = !placeModeId;
      el.dataset.id = card.id;
      const cardColor = getColor(card.color || "none");
      if (card.color && card.color !== "none") {
        el.classList.add("has-color");
        el.style.background = cardColor.card;
        el.style.borderColor = cardColor.border;
        el.style.setProperty("--card-accent", cardColor.accent);
      }

      el.addEventListener("dragstart", (e) => {
        if (placeModeId) {
          e.preventDefault();
          return;
        }
        el.classList.add("dragging");
        e.dataTransfer.setData("text/card-id", card.id);
        e.dataTransfer.effectAllowed = "move";
      });
      el.addEventListener("dragend", () => {
        el.classList.remove("dragging");
        clearDropHints();
      });
      el.addEventListener("dblclick", () => {
        if (placeModeId) return;
        openEditor(card.id);
      });

      el.addEventListener("click", (e) => {
        if (!placeModeId) return;
        e.stopPropagation();
        if (card.id === placeModeId) return;
        const rect = el.getBoundingClientRect();
        const before = e.clientY < rect.top + rect.height / 2;
        finishPlace(card.column, card.id, before ? "before" : "after");
      });

      // Idee direkt auf eine Karte / Position in der Spalte ziehen
      el.addEventListener("dragover", (e) => {
        if (placeModeId || draggingColumnId) return;
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = "move";
        const rect = el.getBoundingClientRect();
        const before = e.clientY < rect.top + rect.height / 2;
        clearDropHints();
        el.classList.add("drop-target", before ? "drop-before" : "drop-after");
        el.parentElement?.classList.add("drag-over");
      });
      el.addEventListener("dragleave", (e) => {
        if (!el.contains(e.relatedTarget)) {
          el.classList.remove("drop-target", "drop-before", "drop-after");
        }
      });
      el.addEventListener("drop", (e) => {
        if (placeModeId || draggingColumnId) return;
        e.preventDefault();
        e.stopPropagation();
        const id = e.dataTransfer.getData("text/card-id");
        const rect = el.getBoundingClientRect();
        const before = e.clientY < rect.top + rect.height / 2;
        clearDropHints();
        moveCard(id, card.column, card.id, before ? "before" : "after");
      });

      const title = document.createElement("p");
      title.className = "card-title";
      title.textContent = card.title;
      el.appendChild(title);

      const dateEl = document.createElement("p");
      dateEl.className = "card-date";
      dateEl.textContent = "Erstellt: " + formatCardDate(card.createdAt);
      el.appendChild(dateEl);

      if (card.notes) {
        const notes = document.createElement("p");
        notes.className = "card-notes";
        notes.textContent = card.notes;
        el.appendChild(notes);
      }

      const meta = document.createElement("div");
      meta.className = "card-meta";

      const actions = document.createElement("div");
      actions.className = "card-actions";

      const editBtn = document.createElement("button");
      editBtn.type = "button";
      editBtn.className = "icon-btn";
      editBtn.title = "Bearbeiten";
      editBtn.textContent = "✎";
      editBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        openEditor(card.id);
      });

      const flipBtn = document.createElement("button");
      flipBtn.type = "button";
      flipBtn.className = "btn-card-flip" + (flipchartHasContent(card.id) ? " has-content" : "");
      flipBtn.title = flipchartHasContent(card.id)
        ? "Flipchart hat Inhalt – öffnen"
        : "Beispiele / Ideen auf Flipchart brainstormen";
      flipBtn.innerHTML = '<span class="dot" aria-hidden="true"></span>Flipchart';
      flipBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        openFlipchart(card.id, card.title);
      });

      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "btn-delete";
      delBtn.title = "Karte löschen";
      delBtn.textContent = "Löschen";
      delBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        deleteCard(card.id);
      });

      actions.append(editBtn, flipBtn, delBtn);
      meta.appendChild(actions);
      el.appendChild(meta);
      return el;
    }

    function deleteCard(id) {
      const card = state.cards.find((c) => c.id === id);
      if (!card) return;
      if (!confirm("Karte löschen?\n\n„" + card.title + "“")) return;
      state.cards = state.cards.filter((c) => c.id !== id);
      saveState("Karte gelöscht");
      render();
    }

    function deleteColumn(columnId) {
      if (columns().length <= 1) {
        alert("Die letzte Spalte kann nicht gelöscht werden.");
        return;
      }
      const col = columns().find((c) => c.id === columnId);
      if (!col) return;
      const count = state.cards.filter((c) => c.column === columnId).length;
      const targetId = fallbackColumnId(columnId);
      const target = columns().find((c) => c.id === targetId);
      const msg =
        count > 0
          ? "Spalte „" +
            col.title +
            "“ löschen?\n\n" +
            count +
            " Karte(n) werden nach „" +
            (target?.title || targetId) +
            "“ verschoben."
          : "Spalte „" + col.title + "“ löschen?";
      if (!confirm(msg)) return;

      state.cards.forEach((c) => {
        if (c.column === columnId) c.column = targetId;
      });
      state.columns = state.columns.filter((c) => c.id !== columnId);
      refreshColumnSelect();
      saveState("Spalte gelöscht");
      render();
    }

    function slugifyColumnId(title) {
      const base =
        String(title)
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-|-$/g, "")
          .slice(0, 24) || "spalte";
      let id = base;
      let n = 2;
      const used = new Set(columns().map((c) => c.id));
      while (used.has(id)) {
        id = base + "-" + n;
        n += 1;
      }
      return id;
    }

    function openColumnEditor() {
      if (placeModeId) return;
      document.getElementById("field-col-title").value = "";
      document.getElementById("field-col-hint").value = "";
      selectedColColor = "yellow";
      buildColorPicker(fieldColColor, selectedColColor, (id) => {
        selectedColColor = id;
      });
      document.getElementById("column-editor").showModal();
      document.getElementById("field-col-title").focus();
    }

    function addColumn(title, hint, colorId) {
      const name = String(title || "").trim();
      if (!name) return;
      const col = {
        id: slugifyColumnId(name),
        title: name,
        hint: String(hint || "").trim(),
        color: colorId || "yellow",
      };
      state.columns.push(col);
      refreshColumnSelect(col.id);
      saveState("Spalte angelegt");
      render();
    }

    function formatCardDate(iso) {
      if (!iso) return "–";
      const raw = String(iso).trim();
      const dateOnly = /^\d{4}-\d{2}-\d{2}$/.test(raw);
      const d = new Date(dateOnly ? raw + "T12:00:00" : raw);
      if (Number.isNaN(d.getTime())) return "–";
      const date = d.toLocaleDateString("de-DE", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
      });
      if (dateOnly) return date;
      const time = d.toLocaleTimeString("de-DE", {
        hour: "2-digit",
        minute: "2-digit",
      });
      return date + ", " + time + " Uhr";
    }

    function nowIsoDate() {
      return new Date().toISOString();
    }

    function normalizeState(data) {
      if (!data || typeof data !== "object") return defaultState();
      if (!Array.isArray(data.cards)) data.cards = structuredClone(SEED_CARDS);
      if (!Array.isArray(data.columns) || !data.columns.length) {
        data.columns = structuredClone(DEFAULT_COLUMNS);
      }
      data.columns = data.columns
        .filter((c) => c && c.id && c.title)
        .map((c) => ({
          id: String(c.id),
          title: String(c.title),
          hint: c.hint ? String(c.hint) : "",
          color: c.color || DEFAULT_COLUMN_COLOR[c.id] || "none",
        }));
      if (!data.columns.length) data.columns = structuredClone(DEFAULT_COLUMNS);

      const valid = new Set(data.columns.map((c) => c.id));
      const fallback = data.columns.find((c) => c.id === "ist")?.id || data.columns[0].id;
      for (const card of data.cards) {
        if (card.column === "done" || !valid.has(card.column)) {
          card.column = fallback;
        }
        delete card.tag;
        if (!card.color) card.color = "none";
      }
      return data;
    }

    function moveCard(id, columnId, anchorId, place) {
      const card = state.cards.find((c) => c.id === id);
      if (!card) return;
      if (anchorId && id === anchorId) return;

      const rest = state.cards.filter((c) => c.id !== id);
      card.column = columnId;

      if (anchorId) {
        const idx = rest.findIndex((c) => c.id === anchorId);
        if (idx >= 0) {
          rest.splice(place === "before" ? idx : idx + 1, 0, card);
          state.cards = rest;
        } else {
          const byCol = {};
          columns().forEach((col) => { byCol[col.id] = []; });
          for (const c of rest) {
            if (!byCol[c.column]) byCol[c.column] = [];
            byCol[c.column].push(c);
          }
          if (!byCol[columnId]) byCol[columnId] = [];
          byCol[columnId].push(card);
          state.cards = columns().flatMap((col) => byCol[col.id] || []);
        }
      } else {
        const byCol = {};
        columns().forEach((col) => { byCol[col.id] = []; });
        for (const c of rest) {
          if (!byCol[c.column]) byCol[c.column] = [];
          byCol[c.column].push(c);
        }
        if (!byCol[columnId]) byCol[columnId] = [];
        byCol[columnId].push(card);
        state.cards = columns().flatMap((col) => byCol[col.id] || []);
      }

      const colTitle = columns().find((c) => c.id === columnId)?.title || columnId;
      saveState("Verschoben → " + colTitle);
      render();
    }

    function startPlaceMode(cardId) {
      placeModeId = cardId;
      const card = state.cards.find((c) => c.id === cardId);
      document.body.classList.add("placing");
      placeBannerText.textContent =
        "Idee „" + (card?.title || "").slice(0, 40) + "“ – jetzt auf Spalte oder Karte klicken";
      if (placeGhost) placeGhost.remove();
      placeGhost = document.createElement("div");
      placeGhost.className = "place-ghost";
      placeGhost.textContent = card?.title || "Neue Idee";
      document.body.appendChild(placeGhost);
      render();
      saveState("Platzieren…");
    }

    function stopPlaceMode(keepInBrainstorm) {
      const id = placeModeId;
      placeModeId = null;
      document.body.classList.remove("placing");
      if (placeGhost) {
        placeGhost.remove();
        placeGhost = null;
      }
      if (keepInBrainstorm && id) {
        const card = state.cards.find((c) => c.id === id);
        if (card) card.column = fallbackColumnId() || columns()[0]?.id;
        saveState("In Standard-Spalte belassen");
      }
      render();
    }

    function finishPlace(columnId, anchorId, place) {
      if (!placeModeId) return;
      const id = placeModeId;
      placeModeId = null;
      document.body.classList.remove("placing");
      if (placeGhost) {
        placeGhost.remove();
        placeGhost = null;
      }
      moveCard(id, columnId, anchorId, place);
    }

    function onPlaceMouseMove(e) {
      if (!placeGhost || !placeModeId) return;
      placeGhost.style.left = e.clientX + "px";
      placeGhost.style.top = e.clientY + "px";
    }

    function defaultEditorTitle() {
      return editId ? "Idee bearbeiten" : "Neue Idee";
    }

    function syncEditorTitle() {
      const el = document.getElementById("editor-title");
      if (!el) return;
      const typed = (fieldTitle.value || "").trim().replace(/\s+/g, " ");
      el.textContent = typed || defaultEditorTitle();
    }

    function openEditor(id, defaultColumn, opts) {
      editId = id;
      createAndPlace = !!(opts && opts.placeAfterCreate) && !id;
      const card = id ? state.cards.find((c) => c.id === id) : null;
      fieldTitle.value = card?.title || "";
      fieldNotes.value = card?.notes || "";
      refreshColumnSelect(card?.column || defaultColumn || fallbackColumnId() || columns()[0]?.id);
      selectedCardColor = card?.color || "none";
      buildColorPicker(fieldCardColor, selectedCardColor, (id) => {
        selectedCardColor = id;
      });
      fieldColumnWrap.classList.toggle("hidden", createAndPlace);
      btnSave.textContent = createAndPlace ? "Anlegen & platzieren" : "Speichern";
      const delInDialog = document.getElementById("btn-delete-card");
      delInDialog.style.display = card ? "inline-flex" : "none";
      const flipInDialog = document.getElementById("btn-card-flip-dialog");
      flipInDialog.style.display = card ? "inline-flex" : "none";
      if (card) {
        const filled = flipchartHasContent(card.id);
        flipInDialog.classList.toggle("has-content", filled);
        flipInDialog.textContent = filled ? "● Flipchart" : "Flipchart";
        flipInDialog.title = filled ? "Flipchart hat Inhalt – öffnen" : "Flipchart öffnen";
      }
      syncEditorTitle();
      editor.showModal();
      fieldTitle.focus();
    }

    fieldTitle.addEventListener("input", syncEditorTitle);

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const title = fieldTitle.value.trim();
      if (!title) return;
      const shouldPlace = createAndPlace;

      if (editId) {
        const card = state.cards.find((c) => c.id === editId);
        if (card) {
          card.title = title;
          card.notes = fieldNotes.value.trim();
          card.column = fieldColumn.value;
          card.color = selectedCardColor || "none";
          delete card.tag;
        }
        createAndPlace = false;
        saveState("Idee aktualisiert");
        editor.close();
        render();
      } else {
        const newId = uid();
        state.cards.push({
          id: newId,
          title,
          notes: fieldNotes.value.trim(),
          column: shouldPlace
            ? (fallbackColumnId() || columns()[0]?.id || "brainstorm")
            : fieldColumn.value,
          createdAt: nowIsoDate(),
          color: selectedCardColor || "none",
        });
        createAndPlace = false;
        editor.close();
        if (shouldPlace) {
          saveState("Idee angelegt – bitte platzieren");
          startPlaceMode(newId);
        } else {
          saveState("Idee angelegt");
          render();
        }
      }
    });

    document.getElementById("btn-cancel").addEventListener("click", () => {
      createAndPlace = false;
      editor.close();
    });
    document.getElementById("btn-delete-card").addEventListener("click", () => {
      if (!editId) return;
      const id = editId;
      editor.close();
      createAndPlace = false;
      deleteCard(id);
    });
    document.getElementById("btn-card-flip-dialog").addEventListener("click", () => {
      if (!editId) return;
      const card = state.cards.find((c) => c.id === editId);
      editor.close();
      openFlipchart(editId, card?.title || "Karte");
    });
    document.getElementById("btn-add").addEventListener("click", () =>
      openEditor(null, fallbackColumnId() || columns()[0]?.id, { placeAfterCreate: true })
    );
    document.getElementById("btn-add-column").addEventListener("click", openColumnEditor);
    document.getElementById("btn-flipchart").addEventListener("click", () => openFlipchart(null, null));
    document.getElementById("btn-flipchart-back").addEventListener("click", () => closeFlipchart());
    document.getElementById("btn-col-cancel").addEventListener("click", () => {
      document.getElementById("column-editor").close();
    });
    document.getElementById("column-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const title = document.getElementById("field-col-title").value.trim();
      const hint = document.getElementById("field-col-hint").value.trim();
      if (!title) return;
      document.getElementById("column-editor").close();
      addColumn(title, hint, selectedColColor);
    });
    document.getElementById("btn-cancel-place").addEventListener("click", () => stopPlaceMode(true));
    document.addEventListener("mousemove", onPlaceMouseMove);

    document.getElementById("search").addEventListener("input", (e) => {
      searchQuery = e.target.value;
      render();
    });

    const colorFilterBtn = document.getElementById("btn-color-filter");
    if (colorFilterBtn) {
      colorFilterBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const bar = document.getElementById("color-filters");
        setColorFilterOpen(!(bar && bar.classList.contains("open")));
      });
    }
    document.addEventListener("click", (e) => {
      const wrap = e.target.closest(".search-wrap");
      if (!wrap) setColorFilterOpen(false);
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") setColorFilterOpen(false);
    });

    document.getElementById("btn-file-autosave").addEventListener("click", () => {
      connectAutosaveFile();
    });

    document.getElementById("btn-export").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = DEFAULT_FILE_NAME;
      a.click();
      URL.revokeObjectURL(a.href);
      statusEl.textContent = "Export heruntergeladen (Einmal-Kopie)";
    });

    document.getElementById("import").addEventListener("change", async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        if (!parsed || !Array.isArray(parsed.cards)) throw new Error("Ungültiges Format");
        state = parsed;
        saveState("Importiert");
        render();
      } catch (err) {
        alert("Import fehlgeschlagen: " + err.message);
      }
      e.target.value = "";
    });

    document.getElementById("btn-reset").addEventListener("click", () => {
      if (!confirm("Board auf den Startinhalt zurücksetzen? Deine lokalen Änderungen gehen verloren.")) return;
      state = defaultState();
      refreshColumnSelect();
      saveState("Zurückgesetzt");
      render();
    });

    document.getElementById("btn-undo").addEventListener("click", () => undoHistory());
    document.getElementById("btn-redo").addEventListener("click", () => redoHistory());

    // keyboard: N = neue Idee, Esc = Platzieren abbrechen / Flipchart schließen
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && document.getElementById("flipchart-overlay").classList.contains("open")) {
        closeFlipchart();
        return;
      }
      if (e.key === "Escape" && placeModeId) {
        stopPlaceMode(true);
        return;
      }
      const mod = e.ctrlKey || e.metaKey;
      if (mod && (e.key === "z" || e.key === "Z")) {
        if (e.target.matches("input, textarea, select")) return;
        e.preventDefault();
        if (e.shiftKey) redoHistory();
        else undoHistory();
        return;
      }
      if (mod && (e.key === "y" || e.key === "Y")) {
        if (e.target.matches("input, textarea, select")) return;
        e.preventDefault();
        redoHistory();
        return;
      }
      if (e.target.matches("input, textarea, select")) return;
      if (placeModeId) return;
      if (document.getElementById("flipchart-overlay").classList.contains("open")) return;
      if (e.key === "n" || e.key === "N") {
        openEditor(null, fallbackColumnId() || columns()[0]?.id, { placeAfterCreate: true });
      }
    });

    const FLIPCHART_LS_PREFIX = "janamathics-flipchart-v1:";
    /** @type {Set<string>} */
    let flipchartFilled = new Set();
    /** @type {Record<string, number>} */
    let flipchartCounts = {};
    let flipchartLoaded = false;
    let flipchartSaveTimer = null;
    let flipchartRoot = null;
    let flipchartScene = null;
    /** @type {string} */
    let flipchartContextId = "global";
    /** @type {string} */
    let flipchartLabel = "Allgemein";

    function flipchartHasContent(id) {
      return flipchartFilled.has(id || "global");
    }

    function countActiveElements(elements) {
      return (elements || []).filter((e) => e && !e.isDeleted).length;
    }

    function updateFlipchartButtonUI(contextId) {
      const id = contextId || "global";
      const filled = flipchartHasContent(id);
      const count = flipchartCounts[id] || 0;

      if (id === "global") {
        const btn = document.getElementById("btn-flipchart");
        if (btn) {
          btn.classList.toggle("has-content", filled);
          btn.title = filled
            ? "Allgemeines Flipchart hat Inhalt (" + count + ")"
            : "Excalidraw Flipchart öffnen";
          btn.textContent = filled ? "● Flipchart" : "Flipchart";
        }
        return;
      }

      const cardBtn = document.querySelector('.card[data-id="' + CSS.escape(id) + '"] .btn-card-flip');
      if (cardBtn) {
        cardBtn.classList.toggle("has-content", filled);
        cardBtn.title = filled
          ? "Flipchart hat Inhalt (" + count + ") – öffnen"
          : "Beispiele / Ideen auf Flipchart brainstormen";
      }

      if (editId === id) {
        const dialogBtn = document.getElementById("btn-card-flip-dialog");
        if (dialogBtn && dialogBtn.style.display !== "none") {
          dialogBtn.classList.toggle("has-content", filled);
          dialogBtn.textContent = filled ? "● Flipchart" : "Flipchart";
          dialogBtn.title = filled ? "Flipchart hat Inhalt – öffnen" : "Flipchart öffnen";
        }
      }
    }

    function setFlipchartFilled(contextId, count) {
      const id = contextId || "global";
      const filled = count > 0;
      const was = flipchartFilled.has(id);
      const prevCount = flipchartCounts[id] || 0;
      if (filled) {
        flipchartFilled.add(id);
        flipchartCounts[id] = count;
      } else {
        flipchartFilled.delete(id);
        delete flipchartCounts[id];
      }
      if (was !== filled || prevCount !== count) {
        updateFlipchartButtonUI(id);
      }
    }

    async function refreshFlipchartIndex() {
      if (IS_FILE_PROTOCOL) {
        // localStorage-Fallback: bekannte Karten-Keys scannen
        flipchartFilled = new Set();
        flipchartCounts = {};
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (!key || !key.startsWith(FLIPCHART_LS_PREFIX)) continue;
          try {
            const data = JSON.parse(localStorage.getItem(key) || "{}");
            const count = countActiveElements(data.elements);
            const id = key.slice(FLIPCHART_LS_PREFIX.length);
            if (count > 0) {
              flipchartFilled.add(id);
              flipchartCounts[id] = count;
            }
          } catch {
            /* ignore */
          }
        }
        return;
      }
      try {
        const res = await fetch("/api/flipchart-index", { cache: "no-store" });
        if (!res.ok) return;
        const data = await res.json();
        flipchartFilled = new Set(data.ids || []);
        flipchartCounts = data.counts || {};
      } catch {
        /* ignore */
      }
    }

    function flipchartApi(contextId) {
      const id = contextId || "global";
      if (id === "global") return "/janamathics-flipchart.json";
      return "/flipcharts/" + encodeURIComponent(id) + ".json";
    }

    function flipchartLsKey(contextId) {
      return FLIPCHART_LS_PREFIX + (contextId || "global");
    }

    function emptyFlipchartScene() {
      return {
        type: "excalidraw",
        version: 2,
        source: "janamathics-kanban",
        elements: [],
        appState: { viewBackgroundColor: "#f7f3e8", gridSize: null },
        files: {},
      };
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        if (document.querySelector('script[src="' + src + '"]')) {
          resolve();
          return;
        }
        const s = document.createElement("script");
        s.src = src;
        s.onload = () => resolve();
        s.onerror = () => reject(new Error("Script fehlgeschlagen: " + src));
        document.head.appendChild(s);
      });
    }

    function loadCss(href) {
      if (document.querySelector('link[href="' + href + '"]')) return;
      const l = document.createElement("link");
      l.rel = "stylesheet";
      l.href = href;
      document.head.appendChild(l);
    }

    async function ensureExcalidraw() {
      if (window.ExcalidrawLib && window.React && window.ReactDOM) return;
      const status = document.getElementById("flipchart-status");
      status.textContent = "Lade Excalidraw…";
      loadCss("https://unpkg.com/@excalidraw/excalidraw@0.17.6/dist/excalidraw.min.css");
      await loadScript("https://unpkg.com/react@18.2.0/umd/react.production.min.js");
      await loadScript("https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js");
      await loadScript("https://unpkg.com/@excalidraw/excalidraw@0.17.6/dist/excalidraw.production.min.js");
      if (!window.ExcalidrawLib) throw new Error("Excalidraw nicht geladen");
    }

    async function loadFlipchartScene(contextId) {
      const api = flipchartApi(contextId);
      const lsKey = flipchartLsKey(contextId);
      if (!IS_FILE_PROTOCOL) {
        try {
          const res = await fetch(api, { cache: "no-store" });
          if (res.ok) {
            const data = await res.json();
            if (data && Array.isArray(data.elements)) return data;
          }
        } catch {
          /* fallback */
        }
      }
      try {
        const raw = localStorage.getItem(lsKey);
        if (raw) {
          const data = JSON.parse(raw);
          if (data && Array.isArray(data.elements)) return data;
        }
      } catch {
        /* ignore */
      }
      return emptyFlipchartScene();
    }

    function queueFlipchartSave(elements, appState, files) {
      const contextId = flipchartContextId || "global";
      flipchartScene = {
        type: "excalidraw",
        version: 2,
        source: "janamathics-kanban",
        elements,
        appState: {
          viewBackgroundColor: (appState && appState.viewBackgroundColor) || "#f7f3e8",
          gridSize: null,
        },
        files: files || {},
      };
      localStorage.setItem(flipchartLsKey(contextId), JSON.stringify(flipchartScene));
      setFlipchartFilled(contextId, countActiveElements(elements));
      clearTimeout(flipchartSaveTimer);
      flipchartSaveTimer = setTimeout(async () => {
        const status = document.getElementById("flipchart-status");
        if (IS_FILE_PROTOCOL) {
          status.textContent = "⚠ Nur Browser-Speicher – bitte über Desktop-Verknüpfung öffnen";
          return;
        }
        try {
          const res = await fetch(flipchartApi(contextId), {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(flipchartScene),
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok && data.ok !== false) {
            const t =
              new Date().toLocaleTimeString("de-DE", {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
              }) + " Uhr";
            status.textContent = "✓ Flipchart gespeichert · " + t;
          } else {
            status.textContent = "⚠ Flipchart-Speichern fehlgeschlagen";
          }
        } catch {
          status.textContent = "⚠ Kein Server – Flipchart nur im Browser";
        }
      }, 400);
    }

    function remountFlipchartRoot() {
      if (flipchartRoot) {
        try {
          flipchartRoot.unmount();
        } catch {
          /* ignore */
        }
        flipchartRoot = null;
      }
      const rootEl = document.getElementById("flipchart-root");
      rootEl.innerHTML = "";
      flipchartLoaded = false;
    }

    async function openFlipchart(cardId, cardTitle) {
      const nextId = cardId || "global";
      const nextLabel = cardId
        ? String(cardTitle || "Karte").trim() || "Karte"
        : "Allgemein";

      if (flipchartLoaded && flipchartContextId !== nextId) {
        remountFlipchartRoot();
      }

      flipchartContextId = nextId;
      flipchartLabel = nextLabel;

      const overlay = document.getElementById("flipchart-overlay");
      const status = document.getElementById("flipchart-status");
      const titleEl = document.getElementById("flipchart-title");
      titleEl.textContent =
        nextId === "global"
          ? "Flipchart (Excalidraw)"
          : "Flipchart: " + nextLabel;

      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");
      try {
        await ensureExcalidraw();
        if (!flipchartLoaded) {
          flipchartScene = await loadFlipchartScene(nextId);
          setFlipchartFilled(nextId, countActiveElements(flipchartScene.elements));
          const rootEl = document.getElementById("flipchart-root");
          flipchartRoot = ReactDOM.createRoot(rootEl);
          const App = () =>
            React.createElement(ExcalidrawLib.Excalidraw, {
              initialData: {
                type: "excalidraw",
                version: 2,
                elements: flipchartScene.elements || [],
                appState: Object.assign(
                  { viewBackgroundColor: "#f7f3e8" },
                  flipchartScene.appState || {},
                  { currentItemFontFamily: 1 }
                ),
                files: flipchartScene.files || {},
                scrollToContent: true,
              },
              langCode: "de-DE",
              onChange: (elements, appState, files) => {
                queueFlipchartSave(elements, appState, files);
              },
            });
          flipchartRoot.render(React.createElement(App));
          flipchartLoaded = true;
          status.textContent = "✓ Flipchart bereit – speichert automatisch";
        } else {
          status.textContent = "✓ Flipchart bereit";
        }
      } catch (err) {
        status.textContent = "Fehler: " + (err && err.message ? err.message : err);
        alert(
          "Flipchart konnte nicht geladen werden.\n\n" +
            (err && err.message ? err.message : err) +
            "\n\nInternetverbindung nötig (Excalidraw von unpkg)."
        );
      }
    }

    function closeFlipchart() {
      const overlay = document.getElementById("flipchart-overlay");
      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden", "true");
    }

    async function boot() {
      if (IS_FILE_PROTOCOL) {
        statusEl.textContent =
          "⚠ HTML direkt geöffnet – Speichern ist unzuverlässig. Bitte „Janamathics Kanban“ / BAT nutzen.";
        alert(
          "Bitte das Board über die Desktop-Verknüpfung „Janamathics Kanban“ öffnen.\n\n" +
            "Nur dann wird zuverlässig in die Datei gespeichert:\n" +
            "docs/brainstorm/janamathics-kanban.json"
        );
      }

      const fromDisk = await loadFromDisk();
      if (fromDisk) {
        state = normalizeState(fromDisk);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        statusEl.textContent = "✓ Geladen";
        updateFooterSaveDate(new Date());
      } else {
        state = normalizeState(loadState());
        updateFooterSaveDate();
      }

      refreshColumnSelect();
      await refreshFlipchartIndex();
      buildColorFilters();
      render();
      updateFlipchartButtonUI("global");
      markHistoryBaseline();
      if (!IS_FILE_PROTOCOL) {
        queueDiskSave();
      }
      restoreAutosaveFile();
      setInterval(updateHistoryButtons, 60000);
    }

    boot();
  </script>
</body>
</html>
