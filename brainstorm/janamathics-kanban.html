<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Janamathics – Kanban Board</title>
  <style>
    :root {
      --bg: #1f3d2f;
      --bg-2: #274c3a;
      --chalk: #e8f0e6;
      --ink: #1a241c;
      --muted: #5c6d60;
      --paper: #fffdf6;
      --line: #d7d0bc;
      --accent: #e2a53a;
      --ok: #6f9b6a;
      --danger: #c45c4a;
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
      --radius: 14px;
      --font: "Segoe UI", Candara, Calibri, "Trebuchet MS", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,0.06), transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0,0,0,0.18), transparent 45%),
        linear-gradient(160deg, var(--bg), var(--bg-2));
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 18px 18px 28px;
      gap: 14px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      color: var(--chalk);
    }

    header h1 {
      margin: 0;
      font-size: clamp(1.4rem, 2.4vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    header p {
      margin: 4px 0 0;
      opacity: 0.85;
      font-size: 0.95rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .search-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }

    .toolbar input[type="search"] {
      min-width: 180px;
      padding: 9px 12px;
      border: 0;
      border-radius: 999px;
      background: rgba(255,255,255,0.92);
      color: var(--ink);
      outline: none;
    }

    .filter-btn {
      width: 40px;
      height: 40px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
    }

    .filter-btn svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    .filter-btn.active {
      outline: 2px solid var(--ink);
      outline-offset: 1px;
    }

    .filter-dot {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 1.5px solid #fff;
      background: var(--accent);
      pointer-events: none;
    }

    .color-filters {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      z-index: 40;
      width: max-content;
      max-width: min(320px, 90vw);
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 0;
      padding: 10px;
      border-radius: 14px;
      background: rgba(255,253,246,0.98);
      border: 1px solid rgba(0,0,0,0.12);
      box-shadow: 0 10px 28px rgba(0,0,0,0.18);
    }

    .color-filters.open {
      display: flex;
    }

    .color-filters-label {
      font-size: 0.82rem;
      font-weight: 650;
      color: var(--muted);
      margin-right: 2px;
      width: 100%;
    }

    .color-filter-chip {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 2px solid rgba(0,0,0,0.18);
      padding: 0;
      cursor: pointer;
      box-shadow: none;
      background: #fff;
      position: relative;
    }

    .color-filter-chip.active {
      outline: 2px solid #1a241c;
      outline-offset: 2px;
    }

    .color-filter-chip[data-color="all"] {
      width: auto;
      min-width: 44px;
      padding: 0 10px;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 650;
      color: var(--ink);
      background: rgba(255,255,255,0.95);
    }

    .color-filter-chip[data-color="none"] {
      background: repeating-conic-gradient(#ddd 0% 25%, #fff 0% 50%) 50% / 10px 10px;
    }

    button, .file-btn {
      border: 0;
      border-radius: 999px;
      padding: 9px 14px;
      background: var(--accent);
      color: #2a1d05;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      box-shadow: 0 2px 0 rgba(0,0,0,0.15);
    }

    button.secondary, .file-btn {
      background: rgba(255,255,255,0.9);
      color: var(--ink);
    }

    .toolbar > button,
    .toolbar > .file-btn {
      background: rgba(255,255,255,0.92);
      color: var(--ink);
      box-shadow: 0 1px 0 rgba(0,0,0,0.12);
    }

    button:hover, .file-btn:hover { filter: brightness(1.05); }
    button:active, .file-btn:active { transform: translateY(1px); }

    .file-btn { display: inline-flex; align-items: center; }
    .file-btn input { display: none; }

    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      min-height: 1.2em;
    }

    .status {
      color: rgba(232,240,230,0.8);
      font-size: 0.85rem;
      min-height: 1.2em;
    }

    .history-btn {
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: 999px;
      background: rgba(255,255,255,0.18);
      color: rgba(232,240,230,0.95);
      box-shadow: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .history-btn:hover:not(:disabled) {
      background: rgba(255,255,255,0.28);
      filter: none;
    }

    .history-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
      align-items: start;
      overflow-x: auto;
      padding-bottom: 8px;
      flex: 1;
    }

    @media (max-width: 1100px) {
      .board { grid-template-columns: repeat(auto-fit, minmax(240px, 80vw)); }
    }

    .column {
      background: rgba(255, 253, 246, 0.94);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-top: 5px solid #6f9b6a;
    }

    .column-head {
      padding: 12px 12px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid var(--line);
    }

    .column-head-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-col-drag {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: grab;
      border-radius: 8px;
      width: 28px;
      height: 28px;
      font-size: 1rem;
      padding: 0;
      box-shadow: none;
      letter-spacing: -1px;
    }

    .btn-col-drag:active { cursor: grabbing; }

    .btn-col-delete {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      border-radius: 8px;
      width: 28px;
      height: 28px;
      font-size: 0.95rem;
      padding: 0;
      box-shadow: none;
    }

    .btn-col-delete:hover {
      background: #f5d7d2;
      color: var(--danger);
    }

    .column.col-dragging {
      opacity: 0.45;
    }

    .column.col-drop-before {
      box-shadow: -4px 0 0 0 var(--accent), var(--shadow);
    }

    .column.col-drop-after {
      box-shadow: 4px 0 0 0 var(--accent), var(--shadow);
    }

    .column-head h2 {
      margin: 0;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .count {
      display: inline-grid;
      place-items: center;
      min-width: 1.5rem;
      height: 1.5rem;
      padding: 0 6px;
      border-radius: 999px;
      background: #efe8d6;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .column-hint {
      margin: 0;
      padding: 0 12px 8px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .cards {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-height: 120px;
    }

    .cards.drag-over {
      background: rgba(226, 165, 58, 0.12);
      outline: 2px dashed var(--accent);
      outline-offset: -6px;
      border-radius: 10px;
    }

    .card.drop-target {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      box-shadow: 0 0 0 4px rgba(226, 165, 58, 0.25);
    }

    .card.drop-before {
      box-shadow: 0 -3px 0 0 var(--accent), 0 2px 0 rgba(0,0,0,0.04);
    }

    .card.drop-after {
      box-shadow: 0 3px 0 0 var(--accent), 0 2px 0 rgba(0,0,0,0.04);
    }

    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 10px 8px;
      box-shadow: 0 2px 0 rgba(0,0,0,0.04);
      cursor: grab;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      position: relative;
    }

    .card.has-color {
      padding-left: 14px;
    }

    .card.has-color::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
      border-radius: 12px 0 0 12px;
      background: var(--card-accent, var(--accent));
    }

    .card:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.08);
    }

    .card.dragging {
      opacity: 0.55;
      cursor: grabbing;
    }

    .color-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 4px 0;
    }

    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 2px solid rgba(0,0,0,0.15);
      cursor: pointer;
      padding: 0;
      box-shadow: none;
      position: relative;
    }

    .color-swatch.selected {
      outline: 2px solid #1a241c;
      outline-offset: 2px;
    }

    .color-swatch[data-color="none"] {
      background: repeating-conic-gradient(#ddd 0% 25%, #fff 0% 50%) 50% / 10px 10px;
    }

    .card-title {
      font-weight: 700;
      font-size: 0.95rem;
      line-height: 1.35;
      margin: 0 0 4px;
      white-space: pre-wrap;
      word-break: break-word;
      color: #142018;
    }

    .card-date {
      margin: 0 0 6px;
      color: #334038;
      font-size: 0.72rem;
      font-weight: 650;
    }

    .card-notes {
      margin: 0;
      color: #2a332c;
      font-size: 0.84rem;
      font-weight: 500;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .card.has-color .card-title {
      color: #101812;
    }

    .card.has-color .card-date,
    .card.has-color .card-notes {
      color: #1c2620;
    }

    .card-meta {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      opacity: 1;
    }

    .btn-delete {
      border: 0;
      border-radius: 999px;
      padding: 4px 10px;
      background: #f5d7d2;
      color: var(--danger);
      font: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: none;
    }

    .btn-delete:hover {
      background: #efc0b8;
      filter: none;
    }

    .btn-card-flip {
      border: 0;
      border-radius: 999px;
      padding: 4px 10px;
      background: #efe8d6;
      color: var(--muted);
      font: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-card-flip:hover {
      background: #e5dcc4;
      filter: none;
      color: var(--ink);
    }

    .btn-card-flip.has-content {
      background: #2f6f4e;
      color: #f3fff6;
    }

    .btn-card-flip.has-content:hover {
      background: #3a855c;
      color: #fff;
    }

    .btn-card-flip .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.35;
      flex: 0 0 auto;
    }

    .btn-card-flip.has-content .dot {
      background: #b8f5c8;
      opacity: 1;
      box-shadow: 0 0 0 2px rgba(184, 245, 200, 0.35);
    }

    #btn-flipchart.has-content {
      background: #2f6f4e;
      color: #f3fff6;
      box-shadow: 0 0 0 2px rgba(47, 111, 78, 0.25);
    }

    #btn-flipchart.has-content:hover {
      background: #3a855c;
      color: #fff;
      filter: none;
    }

    #btn-card-flip-dialog.has-content {
      background: #2f6f4e !important;
      color: #f3fff6 !important;
    }

    .icon-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      border-radius: 8px;
      width: 28px;
      height: 28px;
      font-size: 0.95rem;
      padding: 0;
      box-shadow: none;
    }

    .icon-btn:hover { background: #efe8d6; color: var(--ink); }
    .icon-btn.danger:hover { background: #f5d7d2; color: var(--danger); }

    .column-foot {
      padding: 8px;
      border-top: 1px solid var(--line);
    }

    .column-foot button {
      width: 100%;
      background: #efe8d6;
      color: var(--ink);
      box-shadow: none;
    }

    dialog {
      border: 0;
      border-radius: 16px;
      padding: 0;
      width: min(480px, calc(100vw - 24px));
      box-shadow: var(--shadow);
    }

    dialog::backdrop { background: rgba(15, 28, 20, 0.55); }

    .dialog-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--paper);
    }

    .dialog-body h3 {
      margin: 0 0 4px;
      word-break: break-word;
      line-height: 1.25;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
    }

    input[type="text"], textarea, select {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      color: var(--ink);
      background: #fff;
      resize: vertical;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 6px;
    }

    .empty {
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      padding: 18px 8px;
      border: 1px dashed var(--line);
      border-radius: 10px;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      color: rgba(232,240,230,0.75);
      font-size: 0.8rem;
    }

    footer a {
      color: inherit;
      font-weight: 650;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    footer a:hover {
      color: #fff;
    }

    footer .footer-save {
      opacity: 0.9;
      text-align: right;
      margin-left: auto;
    }

    body.placing {
      cursor: copy;
    }

    body.placing .board {
      outline: 3px dashed var(--accent);
      outline-offset: 4px;
      border-radius: 12px;
    }

    body.placing .column {
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    body.placing .column:hover,
    body.placing .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 0 3px rgba(226, 165, 58, 0.55), var(--shadow);
    }

    .place-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 14px;
      border-radius: 12px;
      background: #fff3bf;
      color: #3a2e08;
      font-weight: 650;
      box-shadow: var(--shadow);
    }

    body.placing .place-banner { display: flex; }

    .place-ghost {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      max-width: 240px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #fff3bf;
      border: 1px solid #e6d27a;
      box-shadow: var(--shadow);
      font-weight: 650;
      font-size: 0.9rem;
      opacity: 0.92;
      transform: translate(12px, 12px) rotate(-2deg);
    }

    .card.placing-source {
      outline: 2px dashed var(--accent);
      opacity: 0.55;
    }

    .field-column-wrap.hidden { display: none; }

    .flipchart-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: #1a241c;
      flex-direction: column;
    }

    .flipchart-overlay.open {
      display: flex;
    }

    .flipchart-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 14px;
      background: #274c3a;
      color: var(--chalk);
    }

    .flipchart-bar h2 {
      margin: 0;
      font-size: 1.05rem;
    }

    .flipchart-bar .tools {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .flipchart-status {
      font-size: 0.85rem;
      opacity: 0.85;
    }

    #flipchart-root {
      flex: 1;
      min-height: 0;
      background: #f7f3e8;
    }

    #flipchart-root .excalidraw {
      height: 100%;
    }
  </style>
  <script>window.EXCALIDRAW_ASSET_PATH = "https://unpkg.com/@excalidraw/excalidraw@0.17.6/dist/";</script>
</head>
<body>
  <header>
    <div>
      <h1>Janamathics – Kanban Board</h1>
    </div>
    <div class="toolbar">
      <div class="search-wrap">
        <button
          type="button"
          class="secondary filter-btn"
          id="btn-color-filter"
          title="Farbe"
          aria-haspopup="true"
          aria-expanded="false"
          aria-controls="color-filters"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M3 5.25A1.25 1.25 0 0 1 4.25 4h15.5A1.25 1.25 0 0 1 21 5.25c0 .3-.11.59-.31.81L15 12.9V19a1 1 0 0 1-1.45.89l-3-1.5A1 1 0 0 1 10 17.5v-4.6L3.31 6.06A1.25 1.25 0 0 1 3 5.25Z"/>
          </svg>
          <span class="filter-dot" id="color-filter-dot" hidden></span>
        </button>
        <div class="color-filters" id="color-filters" role="menu" aria-label="Nach Farbe filtern"></div>
        <input id="search" type="search" placeholder="Karten suchen…" />
      </div>
      <button type="button" class="secondary" id="btn-add" title="Neue Idee">+ Idee</button>
      <button type="button" class="secondary" id="btn-add-column" title="Neue Spalte">+ Spalte</button>
      <button type="button" class="secondary" id="btn-flipchart" title="Excalidraw Flipchart öffnen">Flipchart</button>
      <button type="button" class="secondary" id="btn-file-autosave" title="Einmal Datei wählen, dann schreibt jede Änderung automatisch hinein">Datei-Autosave</button>
      <button type="button" class="secondary" id="btn-export">Export</button>
      <label class="file-btn">Import<input id="import" type="file" accept="application/json,.json" /></label>
      <button type="button" class="secondary" id="btn-reset" title="Auf Startinhalt zurücksetzen">Reset</button>
    </div>
  </header>
  <div class="status-row">
    <button type="button" class="history-btn" id="btn-undo" title="Zurück" aria-label="Zurück" disabled>↶</button>
    <button type="button" class="history-btn" id="btn-redo" title="Vor" aria-label="Vor" disabled>↷</button>
    <div class="status" id="status">✓ Speichert automatisch in Datei</div>
  </div>
  <div class="place-banner" id="place-banner" role="status">
    <span id="place-banner-text">Idee angelegt – jetzt auf eine Spalte oder Karte klicken</span>
    <button type="button" class="secondary" id="btn-cancel-place">Abbrechen (Esc)</button>
  </div>
  <main class="board" id="board" aria-label="Kanban Board"></main>
  <footer>
    <span class="footer-credit">Made by <a href="https://miroposa.eu/" target="_blank" rel="noopener noreferrer">Miroposa</a></span>
    <span class="footer-save" id="footer-save-date">Änderungen werden automatisch gespeichert: Stand —</span>
  </footer>

  <div class="flipchart-overlay" id="flipchart-overlay" aria-hidden="true">
    <div class="flipchart-bar">
      <h2 id="flipchart-title">Flipchart (Excalidraw)</h2>
      <span class="flipchart-status" id="flipchart-status">Bereit</span>
      <div class="tools">
        <button type="button" class="secondary" id="btn-flipchart-back">← Zurück zum Kanban</button>
      </div>
    </div>
    <div id="flipchart-root"></div>
  </div>

  <dialog id="editor">
    <form method="dialog" class="dialog-body" id="editor-form">
      <h3 id="editor-title">Karte bearbeiten</h3>
      <label>Titel
        <textarea id="field-title" rows="3" required></textarea>
      </label>
      <label>Notizen (optional)
        <textarea id="field-notes" rows="3" placeholder="Details, Fragen, Links…"></textarea>
      </label>
      <label class="field-column-wrap" id="field-column-wrap">Spalte
        <select id="field-column"></select>
      </label>
      <label>Farbe
        <div class="color-picker" id="field-card-color" role="listbox" aria-label="Ideenfarbe"></div>
      </label>
      <div class="dialog-actions">
        <button type="button" class="secondary" id="btn-delete-card" style="margin-right:auto;display:none;background:#f5d7d2;color:#c45c4a;">Löschen</button>
        <button type="button" id="btn-card-flip-dialog" style="display:none;background:#ffe8a3;color:#5d4037;">Flipchart</button>
        <button type="button" class="secondary" id="btn-cancel" value="cancel">Abbrechen</button>
        <button type="submit" id="btn-save" value="default">Speichern</button>
